name: Release

# Pushing a tag such as v1.0.0 packages the addon, uploads it to CurseForge and attaches the zip
# to a GitHub release. The CurseForge upload needs the CF_API_TOKEN repository secret and the
# X-Curse-Project-ID line in the toc; without them only the GitHub release gets the zip.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      # Full history, so the packager finds the previous tag for the changelog.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: BigWigsMods/packager@v2
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
