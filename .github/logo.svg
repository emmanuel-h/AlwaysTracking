<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#1c3329"/>
      <stop offset="1" stop-color="#070d0b"/>
    </radialGradient>
    <radialGradient id="radar" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#1f5a3a"/>
      <stop offset="0.75" stop-color="#11301f"/>
      <stop offset="1" stop-color="#0a1c13"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8dff9a" stop-opacity="0"/>
      <stop offset="1" stop-color="#8dff9a" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="0.5" stop-color="#e0a93a"/>
      <stop offset="1" stop-color="#a8701c"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2c8f3a"/>
      <stop offset="1" stop-color="#9af07a"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <path id="leafShape" d="M0 0 C 26 -28, 26 -78, 0 -110 C -26 -78, -26 -28, 0 0 Z"/>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Radar -->
  <circle cx="256" cy="256" r="172" fill="url(#radar)" stroke="#0a1c13" stroke-width="4"/>
  <g fill="none" stroke="#e0a93a" stroke-opacity="0.28" stroke-width="2">
    <circle cx="256" cy="256" r="118"/>
    <circle cx="256" cy="256" r="62"/>
    <line x1="256" y1="88" x2="256" y2="424"/>
    <line x1="88" y1="256" x2="424" y2="256"/>
  </g>
  <path d="M256 256 L256 86 A170 170 0 0 1 403.2 171 Z" fill="url(#sweep)"/>

  <!-- Node blips -->
  <g fill="#ffe36b" filter="url(#glow)">
    <circle cx="338" cy="150" r="8"/>
    <circle cx="170" cy="338" r="7"/>
    <circle cx="352" cy="330" r="6"/>
  </g>

  <!-- Herb sprig -->
  <g filter="url(#shadow)" stroke="#0f3d17" stroke-width="4" stroke-linejoin="round">
    <path d="M256 372 C 252 330, 262 290, 256 236" fill="none" stroke="#2c6b2c" stroke-width="9" stroke-linecap="round"/>
    <use href="#leafShape" fill="url(#leaf)" transform="translate(256 240) scale(1.05)"/>
    <use href="#leafShape" fill="url(#leaf)" transform="translate(255 318) rotate(-58) scale(0.85)"/>
    <use href="#leafShape" fill="url(#leaf)" transform="translate(258 292) rotate(56) scale(0.8)"/>
  </g>
  <g stroke="#0f3d17" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M256 234 L256 142"/>
    <path d="M255 318 L 196 281" />
    <path d="M258 292 L 316 255" />
  </g>

  <!-- Always-on refresh arrow -->
  <g filter="url(#shadow)">
    <path d="M356 82.8 A200 200 0 1 1 187.6 68.1" fill="none" stroke="url(#gold)" stroke-width="22" stroke-linecap="round"/>
    <path d="M-4 -32 L60 0 L-4 32 Z" transform="translate(187.6 68.1) rotate(-20)" fill="#f2c55a" stroke="#a8701c" stroke-width="4" stroke-linejoin="round"/>
  </g>
</svg>
